[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paris-fc-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
 "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
 "pydantic-settings>=2.6,<3", "httpx>=0.28,<1",
 "PyJWT>=2.10,<3", "argon2-cffi>=23,<26",
 "beautifulsoup4>=4.12,<5", "email-validator>=2,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
