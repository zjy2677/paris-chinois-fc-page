name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ruff lint
            command: python -m ruff check --config backend/pyproject.toml backend etl scripts
          - name: Ruff format
            command: python -m ruff format --config backend/pyproject.toml --check backend etl scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.lock
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check -c backend/requirements-ci.lock ruff
      - name: Validate Python style
        run: ${{ matrix.command }}

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paris_ci_test
          POSTGRES_USER: postgres
          # Disposable runner-only database; no production credentials or secrets.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paris_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/paris_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/paris_ci_test
      APP_ENV: development
      AUTH_COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:4173"]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-ci.lock
            backend/pyproject.toml
      - name: Install locked backend and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.lock -r backend/requirements-ci.lock
          python -m pip install --no-deps -e ./backend
      - name: Apply migrations to disposable database
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Run backend and ETL regression tests
        run: python -m pytest backend/tests scripts/tests -q

  frontend:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Frontend format
            command: bun run format:check
          - name: TypeScript
            command: bun run typecheck
          - name: ESLint
            command: bun run lint
          - name: Frontend tests
            command: bun run test
          - name: Frontend build
            command: bun run build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('frontend/bun.lock', 'frontend/package.json') }}
      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile
      - name: Validate frontend
        run: ${{ matrix.command }}
