name: Check Alembic migration graph

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alembic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  alembic-head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install Alembic
        run: python -m pip install --disable-pip-version-check -c backend/requirements.lock alembic

      - name: Require one migration head
        run: python scripts/check_alembic_heads.py

      - name: Verify multiple-head failure detection
        run: python -m unittest discover -s scripts/tests -v
