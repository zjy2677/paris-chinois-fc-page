name: Check Alembic migration graph

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alembic-head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Alembic
        run: python -m pip install --disable-pip-version-check "alembic>=1.14,<2"

      - name: Require one migration head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(python -m alembic heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | awk '/\(head\)$/ { count += 1 } END { print count + 0 }')"
          if [[ "$count" -ne 1 ]]; then
            echo "Expected exactly one Alembic head; found $count." >&2
            exit 1
          fi
