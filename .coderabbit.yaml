# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  auto_review:
    # The branch-gate workflow opts dev-targeted PRs in with this label.
    enabled: false
    labels:
      - "coderabbit-review"
    drafts: false
    base_branches:
      - "^dev$"
    auto_incremental_review: true
